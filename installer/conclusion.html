<h1>앱 설치를 마쳤습니다</h1>
<ol><li>응용 프로그램 폴더에서 <b>SoriNote</b>를 여세요.</li><li>실행 환경과 회사 네트워크 설정을 확인한 뒤 <b>준비 시작</b>을 누르세요.</li><li>준비가 끝나면 <b>음성 설정</b>에서 마이크와 시스템 소리를 선택하세요.</li></ol>
<p>기존 사용자에게 자동 설치 화면이 보이지 않으면 <b>모델 및 환경 설정 → 공통 환경 → 자동 설치 / 복구</b>를 여세요.</p>
<p>화자 분리는 선택 기능입니다. 먼저 설정에서 Hugging Face 인증과 모델 이용 조건을 확인하세요.</p></html>
